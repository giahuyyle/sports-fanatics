# Local development. Real Firebase Auth is the default; see docs/backend/FIREBASE.md.
x-backend: &backend
  image: sports-fanatics-backend:dev
  build:
    context: ./backend
  init: true
  working_dir: /app
  environment: &backend-environment
    DATABASE_URL: postgresql+psycopg://fanatics:local-development-only@db:5432/fanatics
    FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-sports-fanatics-local}
    SOLVER_TIMEOUT_SECONDS: ${SOLVER_TIMEOUT_SECONDS:-2}
    WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-1}
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fanatics
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: fanatics
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanatics -d fanatics"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      <<: *backend-environment
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}","http://127.0.0.1:${FRONTEND_PORT:-5173}"]'
      GOOGLE_APPLICATION_CREDENTIALS: /run/firebase/firebase-admin.json
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
    volumes:
      - ./backend:/app
      - type: bind
        source: ${FIREBASE_CREDENTIALS_DIR:-./.secrets}
        target: /run/firebase
        read_only: true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
    init: true
    environment:
      API_PROXY_TARGET: http://api:8000
      # Explicit values override any native-dev frontend/.env, including old emulators.
      VITE_API_BASE_URL: ""
      VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_AUTH_EMULATOR_URL: ${FIREBASE_AUTH_EMULATOR_URL:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Refresh the container-only dependency volume when package-lock.json changes.
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  auth:
    profiles: ["emulator"]
    build:
      context: ./docker/auth
    init: true
    ports:
      - "127.0.0.1:${AUTH_PORT:-9099}:9099"
    volumes:
      - auth_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
    stop_grace_period: 30s

volumes:
  postgres_data:
  frontend_node_modules:
  auth_data:
